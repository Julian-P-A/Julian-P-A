name: Update contributions panel

on:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies (Puppeteer + Chromium)
        run: npm ci

      - name: Regenerate assets/contributions.png
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: Julian-P-A
        run: npm run build:contributions

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- assets/contributions.png; then
            git add assets/contributions.png
            git commit -m "chore: refresh contributions panel"
            git push
          else
            echo "No changes in contributions panel"
          fi
